<title>物理？根本就是召喚咒語！</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：Game Boy 掌機畫面，四階灰綠調色盤；戰鬥畫面仿初代寶可夢（敵上右、自己下左、底部對話框） */
:root{
  --c0:#081820; --c1:#346856; --c2:#88c070; --c3:#e0f8d0;
  --pix:"DotGothic16","Noto Sans TC",monospace;
  --body:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--c1);color:var(--c0);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:0;background:var(--c3);border:4px solid var(--c0);box-shadow:0 0 0 4px var(--c2)}
h1,h2,.pix{font-family:var(--pix);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:1.5rem;letter-spacing:.04em;line-height:1.35;text-align:center;padding:8px 0}
h2{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px dashed var(--c0);outline-offset:2px}
.dim{color:var(--c1);font-size:.88rem}
.btn{background:var(--c3);border:3px solid var(--c0);box-shadow:3px 3px 0 var(--c1);padding:8px 12px;font-family:var(--pix);font-size:1rem}
.btn:hover:not(:disabled){background:var(--c2)}
.btn:active:not(:disabled){box-shadow:none;transform:translate(3px,3px)}
.btn:disabled{color:var(--c1);border-color:var(--c1);box-shadow:none;cursor:default}
.box{background:var(--c3);border:4px double var(--c0);padding:10px 12px;margin:6px}
canvas{display:block;width:100%;max-width:100%;image-rendering:pixelated;border-bottom:4px solid var(--c0);background:var(--c3)}
.title{display:flex;flex-direction:column;gap:6px;padding:6px}
.title>p,.title>.row,.title>.stages,.title>h2{margin:0 6px}
.spirits-intro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.spirits-intro div{display:flex;flex-direction:column;border:2px solid var(--c0);padding:4px 8px;background:var(--c2)}
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.stage .n{min-width:1.6em}
.stage .t{flex:1;min-width:0}
.stage small{display:block;color:var(--c1);font-size:.8rem}
.stage:hover:not(:disabled) small{color:var(--c0)}
/* 戰鬥狀態框 */
.hud{position:absolute;display:flex;flex-direction:column;gap:2px;font-family:var(--pix);font-size:.8rem;min-width:0}
.battle{position:relative}
.hud.e{top:8px;left:8px;width:46%;border-bottom:3px solid var(--c0);border-right:3px solid var(--c0);padding:2px 6px 4px;background:var(--c3)}
.hud.p{bottom:8px;right:8px;width:50%;border-bottom:3px solid var(--c0);border-left:3px solid var(--c0);padding:2px 6px 4px;background:var(--c3)}
.hud .lbl{display:flex;justify-content:space-between;gap:4px;font-variant-numeric:tabular-nums}
.hud .lbl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hprow{display:flex;align-items:center;gap:4px}
.hprow b{font-weight:400;font-size:.7rem}
.meter{flex:1;height:8px;background:var(--c3);border:2px solid var(--c0);border-radius:4px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--c1);transition:width .5s steps(10)}
.meter.low i{background:var(--c0)}
.log{min-height:3.4em;margin:0;border:0;border-top:0;font-size:1rem}
.tabs{display:flex;gap:6px;margin:6px 6px 0}
.tabs .btn{flex:1}
.tabs .btn.on{background:var(--c0);color:var(--c3)}
.menu .sp:last-child:nth-child(odd){grid-column:1/-1}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px}
.sp{display:flex;flex-direction:column;align-items:flex-start;text-align:left;position:relative;padding-left:22px}
.sp::before{content:"▶";position:absolute;left:6px;top:8px;font-size:.7rem;opacity:0}
.sp:hover::before,.sp:focus-visible::before{opacity:1}
.sp small{font-size:.75rem;color:var(--c1)}
.sp .weak{position:absolute;bottom:4px;right:4px;background:var(--c0);color:var(--c3);font-size:.65rem;padding:0 4px}
.quiz{display:flex;flex-direction:column;gap:8px}
.scroll{font-size:.85rem;color:var(--c1);font-family:var(--pix)}
.q{font-size:1.02rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;font-family:var(--body);font-size:.98rem;padding:8px 10px 8px 24px;position:relative}
.opt::before{content:"▶";position:absolute;left:7px;top:9px;font-size:.7rem;opacity:0}
.opt:hover::before{opacity:1}
.opt.right{background:var(--c0);color:var(--c3)}
.opt.right::before{opacity:1;content:"○"}
.opt.wrong{background:var(--c2);text-decoration:line-through}
.opt.wrong::before{opacity:1;content:"×"}
.fb{display:flex;flex-direction:column;gap:8px}
.fb .head{font-family:var(--pix);font-size:1.1rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-variant-numeric:tabular-nums}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}.blink{animation:none}}
</style>

function buildQB(){
  const O={1:QB1,2:QB2,3:QB3},R={};
  for(const t of [1,2,3]){
    const o=O[t],n=NEW[t];
    R[t]={
      none:[...o.earth,...o.moon,...o.thunder,...n.motion],
      fire:[...o.fire,...n.heat],
      light:[...(t===1?[o.photon[0],o.photon[1],o.photon[3]]:[]),...n.wave],
      electric:[...n.elec],
      poison:t===1?[...n.chem]:[],
      quantum:t===1?[...o.atom]:[...o.photon,...o.atom,...(n.quant||[])],
      spacetime:t===3?[...o.time,...(n.time||[])]:[]
    };
  }
  return R;
}

const LEVELS=[{tag:'低',name:'低階',m:.7},{tag:'中',name:'中階',m:1},{tag:'高',name:'高階',m:2.5}];
function makeMon(stage,mi,lvl){const b=STAGES[stage].mons[mi],m=LEVELS[lvl].m;return Object.assign({},b,{name:'【'+LEVELS[lvl].tag+'】'+b.name,hp:Math.round(b.hp*m),atk:b.atk*m,def:m});}
// 屬性相剋（左邊剋右邊）：火剋毒、毒剋光、光剋電、電剋火；量子剋光與電；時空剋量子、火、毒；無屬性不剋也不被剋。
const BEATS={fire:['poison','quantum'],poison:['light','quantum'],light:['electric','spacetime'],electric:['fire','spacetime'],quantum:['light','electric'],spacetime:['quantum','fire','poison'],none:[]};
const adv=(a,d)=>(BEATS[a]||[]).includes(d);
const rel=(k,el)=>{const e=UNITS[k].elem;return adv(e,el)?1:adv(el,e)?-1:0;}; // 1 剋制、-1 被剋

function freshState(){return{cleared:0,xp:{none:0,light:0,electric:0,fire:0,poison:0,quantum:0,spacetime:0},best:[0,0,0,0,0],right:0,wrong:0};}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d&&d.xp){S=Object.assign(freshState(),d);S.xp=Object.assign(freshState().xp,d.xp);if(!Array.isArray(S.best)||S.best.length!==5){S.best=[0,0,0,0,0];for(let i=0;i<(S.cleared||0)&&i<5;i++)S.best[i]=1;}}}catch(e){}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
const LV_MAX=50;
const lv=k=>Math.min(LV_MAX,1+Math.floor(S.xp[k]/3));
// 傷害用的等級：Lv5 以前每級 +4，之後每級只 +1.2，避免高等級一擊秒殺
const lvPow=k=>{const l=lv(k);return l<=5?l:5+(l-5)*.3;};

const decks={};
// 精靈等級越高，越常抽到該題庫中較難的題目：Lv1 抽最簡單的，Lv50 抽最難的（依難度星數與題目長度排序）
const pools={};
function draw1(k,t){
  const pool=QB[t][k], id=t+k, n=pool.length;
  if(!pools[id]){
    const ord=pool.map((_,i)=>i).sort((a,b)=>(pool[a].d*100+pool[a].q.length)-(pool[b].d*100+pool[b].q.length));
    pools[id]={pct:[],recent:[]};ord.forEach((i,r)=>pools[id].pct[i]=n>1?r/(n-1):0);
  }
  const P=pools[id], target=(lv(k)-1)/(LV_MAX-1);
  const cand=pool.map((_,i)=>i).filter(i=>!P.recent.includes(i));
  const w=cand.map(i=>Math.exp(-Math.pow((P.pct[i]-target)/.3,2)));
  let r=Math.random()*w.reduce((x,y)=>x+y,0),j=0;
  for(;j<w.length-1&&r>w[j];j++)r-=w[j];
  const pick=cand[j];P.recent.push(pick);if(P.recent.length>Math.min(4,n-1))P.recent.shift();
  return pool[pick];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

// 精靈漸漸淡出，之後召喚師再從左下角滑回來
async function retire(){B.fadeT=performance.now();await sleep(620);B.spirit=null;B.fadeT=0;await sleep(540);}
async function answer(k,q,opts,pick){
  if(B.busy)return;B.busy=true;
  const ok=opts[pick]===q.c[0], def=B.mode==='def', r=rel(k,B.el);

  ok?S.right++:S.wrong++;
  let note='';
  if(!def){
    if(ok){
      S.xp[k]++;B.streak++;
      const crit=B.tier===3&&q.h, mult=(r>0?2:r<0?.5:1)*(1+Math.min(.5,(B.streak-1)*.1))*(crit?1.5:1);
      const dmg=Math.max(1,Math.round((16+lvPow(k)*4)*mult*TIERS[B.tier].mult*(0.9+Math.random()*.2)/B.st.def));
      note=(r>0?'屬性剋制，傷害加倍！':r<0?'屬性不利，傷害減半……':'')+(crit?'高難度咒語爆擊，傷害 +50%！':'');
      setLog(`咒語完成！<b>${UNITS[k].name}</b>現身。${note}`);

      B.spirit=k;await play('summon',620);await play('bolt',atkMs(k));

      B.ehp-=dmg;addText('-'+dmg+(crit?'爆':r>0?'!':''),118,40);updBars();
      await sleep(400);await retire();
    }else{
      B.streak=0;
      setLog('咒語唸錯了，精靈沒有回應……');
      await play('fizzle',690);
    }
  }else{
    let dmg=B.incoming, counter=0;
    if(ok){
      S.xp[k]++;
      const f=(r>0?.15:r<0?.85:.5)*(B.tier===1?1.2:B.tier===3?.8:1);
      dmg=Math.round(B.incoming*Math.min(1,f));
      note=r>0?'屬性剋制，幾乎完全擋下！':r<0?'屬性不利，只擋下一點點……':'擋下了一半。';
      setLog(`咒語完成！<b>${UNITS[k].name}</b>擋在你面前。${note}`);
      await sleep(620);
      counter=B.tier===3&&q.h?Math.round(B.incoming*.5):0;
      B.spirit=k;await play('summon',620);B.guard=true;
    }else{
      note='防禦失敗，承受全部傷害。';
      setLog('咒語唸錯了，來不及防禦……');
      await play('fizzle',690);
    }
    await play('enemy',620);
    if(dmg>0){B.pShake=1;B.pFlash=1;await sleep(560);}
    B.guard=false;
    if(dmg>0){B.php-=dmg;addText('-'+dmg,40,50);if(B.php<=0)B.pdead=true;}else addText('擋住',40,50);
    updBars();await sleep(620);
    if(counter>0){await play('bolt',atkMs(B.spirit));B.eShake=1;B.eFlash=1;await sleep(560);B.ehp-=counter;addText('-'+counter+'反',118,40);updBars();await sleep(620);}
    await retire();
    note=`${note}（受到 ${dmg} 點傷害）`+(counter>0?`高難度咒語觸發反擊，對${B.st.name}造成 ${counter} 點傷害！`:'');
  }
  save();
  feedback(ok,q,note);
}

let raf=0,ctx=null;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(kind,dur){B.fx.push({kind,t0:performance.now(),dur});return sleep(dur);}
function addText(t,x,y){B.texts.push({t,x,y,t0:performance.now()});}
function startLoop(){ctx=document.getElementById('cv').getContext('2d');ctx.imageSmoothingEnabled=false;ctx.setTransform(2,0,0,2,0,0);cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);}
function stopLoop(){cancelAnimationFrame(raf);}
function sprite(name,x,y,s,flip,hide){
  const d=SPR[name],big=d.m.length>12;if(big){s=s/2;if(d.r)flip=false;}
  const R=v=>Math.round(v*2)/2;
  d.m.forEach((row,r)=>{for(let c=0;c<row.length;c++){const ch=row[c];if(ch==='.')continue;
    ctx.fillStyle=GB[hide?3:shade(d.p[ch])];const cx=flip?(row.length-1-c):c;ctx.fillRect(R(x+cx*s),R(y+r*s),s,s);}});
}

const R=v=>Math.round(v*2)/2;
function drawGrid(ctx,rows,x,y,cell){rows.forEach((row,r)=>{for(let c=0;c<row.length;c++){const ch=row[c];if(ch==='.')continue;ctx.fillStyle=GB[+ch];ctx.fillRect(R(x+c*cell),R(y+r*cell),cell,cell);}});}
const disc=(ctx,cx,cy,r,col)=>{ctx.fillStyle=GB[col];for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy)+.3);ctx.fillRect(Math.round(cx)-w,Math.round(cy)+dy,w*2+1,1);}};
const ring=(ctx,cx,cy,rx,ry,col)=>{ctx.fillStyle=GB[col];for(let a=0;a<80;a++){const t=a/80*Math.PI*2;ctx.fillRect(Math.round(cx+rx*Math.cos(t)),Math.round(cy+ry*Math.sin(t)),1,1);}};

// 攻擊飛行物：(bx,by) 為目前位置，now 為毫秒
const PROJ={
  newton(ctx,bx,by,p,now,tr){
    tr.forEach((q,i)=>{ctx.globalAlpha=.4-i*.18;apple(ctx,q[0],q[1]);});ctx.globalAlpha=1;apple(ctx,bx,by);},
  light(ctx,bx,by,p,now){
    for(let i=0;i<26;i++){const x=bx-7-i*1.6,y=by+Math.sin((i*.6)+now/70)*3.2;ctx.fillStyle=GB[i%6<2?3:i%6<4?2:1];ctx.fillRect(Math.round(x),Math.round(y),2,2);}
    disc(ctx,bx,by,6,0);disc(ctx,bx,by,5,2);disc(ctx,bx,by,3,3);
    ctx.fillStyle=GB[0];ctx.fillRect(bx-9,by,19,1);ctx.fillRect(bx,by-9,1,19);ctx.fillStyle=GB[3];ctx.fillRect(bx-8,by,17,1);ctx.fillRect(bx,by-8,1,17);},
  electric(ctx,bx,by,p,now){
    const s=Math.floor(now/70)%2?1:-1,pts=[[bx-12,by-9],[bx-4,by-1*s],[bx-7,by+1],[bx+2,by-4*s],[bx+1,by+1],[bx+10,by+8]];
    for(let k=0;k<2;k++)for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[c,d]=pts[i+1],n=Math.max(Math.abs(c-a),Math.abs(d-b));
      for(let j=0;j<=n;j++){const x=Math.round(a+(c-a)*j/n),y=Math.round(b+(d-b)*j/n);ctx.fillStyle=GB[k?3:0];const w=k?1:3;ctx.fillRect(x-(k?0:1),y-(k?0:1),w,w);}}
    for(let i=0;i<22;i++){ctx.fillStyle=GB[i%4<2?3:1];ctx.fillRect(Math.round(bx-14-i*1.5),Math.round(by+Math.sin(i*.7+now/60)*4),2,2);}
    for(let i=0;i<5;i++){const t=Math.floor(now/90)+i*7;ctx.fillStyle=GB[3];ctx.fillRect(bx-8+((t*37)%20),by-9+((t*53)%18),2,2);}},
  fire(ctx,bx,by,p,now){
    for(let i=4;i>=1;i--){const r=Math.max(2,6-i),y=by+Math.sin(now/80+i)*2.2;disc(ctx,bx-i*7,y,r,0);disc(ctx,bx-i*7,y,r-1,i<3?2:1);if(i<3)disc(ctx,bx-i*7,y,r-2>0?r-2:1,3);}
    disc(ctx,bx,by,7,0);disc(ctx,bx,by,6,2);disc(ctx,bx,by,4,3);
    const f=Math.floor(now/90)%2;ctx.fillStyle=GB[2];ctx.fillRect(bx-2,by-9-f,2,3);ctx.fillRect(bx+2,by-8+f,2,2);},
  poison(ctx,bx,by,p,now){
    for(let i=4;i>=1;i--){const r=Math.max(2,5-i),x=bx-i*8,y=by+((i%2)?3:-3);disc(ctx,x,y,r,0);disc(ctx,x,y,r-1,i<3?1:2);}
    disc(ctx,bx,by,7,0);disc(ctx,bx,by,6,1);disc(ctx,bx,by,3,2);ctx.fillStyle=GB[3];ctx.fillRect(bx-4,by-4,3,2);ctx.fillRect(bx-4,by-2,1,1);ctx.fillRect(bx+2,by+3,2,1);},
  quantum(ctx,bx,by,p,now){
    const a=now/110;ring(ctx,bx,by,10,4,1);
    ring(ctx,bx,by,4,10,1);
    disc(ctx,bx,by,4,0);disc(ctx,bx,by,3,3);disc(ctx,bx,by,1,1);
    for(const[rx,ry,ph]of[[10,4,0],[4,10,2.1]]){const x=bx+rx*Math.cos(a+ph),y=by+ry*Math.sin(a+ph);disc(ctx,x,y,3,0);disc(ctx,x,y,2,3);}},
  spacetime(ctx,bx,by,p,now){   // 黑洞（參考《星際效應》）：黑色球體、上下兩道被重力透鏡扭曲的光環弧、中間一條橫貫的亮線
    for(let i=3;i>=1;i--)disc(ctx,bx-i*9,by,Math.max(2,7-i*2),i<3?1:2);
    const arc=(a0,a1,r0,r1,ky,col)=>{ctx.fillStyle=GB[col];for(let a=a0;a<=a1;a+=0.012)for(let r=r0;r<=r1;r+=.5)ctx.fillRect(Math.round(bx+Math.cos(a)*r),Math.round(by+Math.sin(a)*r*ky),1,1);};
    const sh=Math.floor(now/120)%2;
    arc(Math.PI*1.02,Math.PI*1.98,10.5,12.5,1,1);      // 上弧外暈
    arc(Math.PI*1.04,Math.PI*1.96,8.5,10.5,1,2);
    arc(0.04*Math.PI,0.96*Math.PI,9.5,11,.85,1);       // 下弧外暈
    arc(0.08*Math.PI,0.92*Math.PI,8,9.5,.85,2);
    disc(ctx,bx,by,7,0);
    arc(Math.PI*1.08,Math.PI*1.92,7.5,8.5,1,3);        // 上弧內亮環
    arc(Math.PI*1.1,Math.PI*1.9,9,9.5,1,sh?3:2);
    arc(0.12*Math.PI,0.88*Math.PI,7.5,8,.85,3);
    ctx.fillStyle=GB[1];ctx.fillRect(bx-22,by-1,44,3);ctx.fillStyle=GB[2];ctx.fillRect(bx-19,by-1,38,2);
    ctx.fillStyle=GB[3];ctx.fillRect(bx-13,by-1,26,1);ctx.fillRect(bx-26,by,52,1);ctx.fillStyle=GB[2];ctx.fillRect(bx-30,by,4,1);ctx.fillRect(bx+26,by,4,1);}
};
// 發射型攻擊（類似死光）：從 (x0,y0) 往 (x1,y1) 延伸，p 為 0..1
const BEAM={
  light(ctx,x0,y0,x1,y1,p,now){   // 惠更斯：光束，束上有一圈圈子波的弧形波前往前推進
    const L=Math.hypot(x1-x0,y1-y0),dx=(x1-x0)/L,dy=(y1-y0)/L,len=L*Math.min(1,p*1.7),th=Math.atan2(dy,dx);
    for(let s=0;s<=len;s++){const x=x0+dx*s,y=y0+dy*s;
      for(let o=-5;o<=5;o++){const a=Math.abs(o);ctx.fillStyle=GB[a<=1?3:a<=3?2:a<=4?1:0];ctx.fillRect(Math.round(x),Math.round(y+o),1,1);}}
    for(let k=0;k<4;k++){const s=(now/22+k*14)%Math.max(len,1);if(s>len-2)continue;const cx=x0+dx*s,cy=y0+dy*s;
      for(let a=-1.2;a<=1.2;a+=.07)ctx.fillRect(Math.round(cx+Math.cos(th+a)*6),Math.round(cy+Math.sin(th+a)*6),1,1);}
    disc(ctx,x0,y0,4,0);disc(ctx,x0,y0,3,3);disc(ctx,x0+dx*len,y0+dy*len,3,3);},
  electric(ctx,x0,y0,x1,y1,p,now){   // 馬克士威：電磁波，電場（垂直，粗）與磁場（交錯，細）沿著箭頭行進
    const L=Math.hypot(x1-x0,y1-y0),dx=(x1-x0)/L,dy=(y1-y0)/L,len=L*Math.min(1,p*1.7);
    for(let s=0;s<=len;s+=1){ctx.fillStyle=GB[0];ctx.fillRect(Math.round(x0+dx*s),Math.round(y0+dy*s),1,1);}
    for(let s=0;s<=len;s+=2){const x=Math.round(x0+dx*s),y=Math.round(y0+dy*s),ph=s*.33-now/90,
        e=Math.sin(ph)*7,b=Math.sin(ph+Math.PI/2)*4;
      ctx.fillStyle=GB[1];ctx.fillRect(x,Math.round(Math.min(y,y+e)),1,Math.round(Math.abs(e))+1);ctx.fillStyle=GB[0];ctx.fillRect(x,Math.round(y+e),1,1);
      ctx.fillStyle=GB[2];ctx.fillRect(x+1,Math.round(Math.min(y,y+b)),1,Math.round(Math.abs(b))+1);ctx.fillStyle=GB[1];ctx.fillRect(x+1,Math.round(y+b),1,1);}
    const ex=x0+dx*len,ey=y0+dy*len;ctx.fillStyle=GB[0];
    for(let k=0;k<6;k++){const hw=Math.round((5-k)*.8);ctx.fillRect(Math.round(ex-dx*(5-k)),Math.round(ey-dy*(5-k)-hw),1,hw*2+1);}
    disc(ctx,x0,y0,3,3);},
  quantum(ctx,x0,y0,x1,y1,p,now){   // 波耳：寫著 H 的原子噴出氫原子光譜（一條條發亮的譜線）
    const ax=62,ay=52+Math.round(Math.sin(now/200)*1.2);
    disc(ctx,ax,ay,6,0);disc(ctx,ax,ay,5,1);
    ctx.fillStyle=GB[3];ctx.fillRect(ax-3,ay-3,1,7);ctx.fillRect(ax+2,ay-3,1,7);ctx.fillRect(ax-2,ay,4,1);
    const sx=ax+7,sy=ay-1,L=Math.hypot(x1-sx,y1-sy),dx=(x1-sx)/L,dy=(y1-sy)/L,len=L*Math.min(1,p*1.7);
    for(let s=0;s<=len;s++){const x=Math.round(sx+dx*s),y=sy+dy*s,m=(s+now/18)%24;
      const col=(m<2||(m>=11&&m<12))?3:(m>=7&&m<9)?2:(m>=17&&m<18)?3:(m>=21&&m<23)?1:null;
      for(let o=0;o<=1;o++){ctx.fillStyle=GB[col===null?0:col];ctx.fillRect(x,Math.round(y+o),1,1);}}
    disc(ctx,sx,sy,2,3);}
};
const SKULL=['...00000...','..0333330..','.033333330.','.030030030.','.030030030.','.033303330.','..0333330..','..0303030..','...00000...'].map(r=>r.replace(/0/g,'#').replace(/3/g,'4').replace(/#/g,'0').replace(/4/g,'3'));
function drawGridWave(ctx,rows,x,y,cell,amp,now){rows.forEach((row,r)=>{const o=Math.round(Math.sin(r*.8+now/70)*amp);for(let c=0;c<row.length;c++){const ch=row[c];if(ch==='.')continue;ctx.fillStyle=GB[+ch];ctx.fillRect(R(x+c*cell+o),R(y+r*cell),cell,cell);}});}
function snapFx(ctx,x,y,p){const r=3+p*7;for(let i=0;i<7;i++){const a=-1.4+i*.5,l=r*(1-p*.4);
  for(let k=Math.round(r*.5);k<=l;k++){ctx.fillStyle=GB[i%2?3:0];ctx.fillRect(Math.round(x+Math.cos(a)*k),Math.round(y+Math.sin(a)*k),1,1);}}}
function flames(ctx,now,grow){   // 以怪獸為中心的一大團火焰：深色外框＋中層＋亮心
  const cx=118,base=52,H=Math.round(44*grow),Wm=19*Math.min(1,grow*1.3);
  for(let pass=0;pass<3;pass++){const sc=[1,.78,.5][pass],hh=Math.round(H*(pass===2?.62:pass===1?.86:1));
    for(let k=0;k<=hh;k++){const u=k/Math.max(hh,1),w=Math.round(Wm*sc*Math.pow(Math.sin(Math.PI*Math.pow(u,.55)),.7)*(1+.1*Math.sin(k*.8+now/60)))+(pass===0?1:0);
      if(w<=0)continue;const sway=Math.round(u*u*4*Math.sin(now/130));
      ctx.globalAlpha=pass===0?1:.82;ctx.fillStyle=GB[[0,2,3][pass]];ctx.fillRect(cx-w+sway,base-k,w*2+1,1);}}
  ctx.globalAlpha=1;
  for(let i=0;i<8;i++){const t=(now/38+i*11)%40;ctx.fillStyle=GB[i%2?3:0];ctx.fillRect(Math.round(cx-14+i*4+Math.sin(t*.6+i)*2),Math.round(42-t*grow),1,1);}
}
function poisonIcon(ctx,now,sc){   // 毒化圖示：三條往上飄的波浪線，沒有外框
  const h=Math.round(15*sc);if(h<2)return;ctx.fillStyle=GB[1];
  for(const off of[-6,0,6])for(let k=0;k<h;k++){const y=18-k;ctx.fillRect(Math.round(118+off+Math.sin(k*.75-now/90)*2),y,2,1);}
}
function apple(ctx,x,y){disc(ctx,x,y,6,0);disc(ctx,x,y,5,2);ctx.fillStyle=GB[3];ctx.fillRect(x-3,y-3,2,2);ctx.fillRect(x-3,y-1,1,1);
  ctx.fillStyle=GB[0];ctx.fillRect(x,y-9,1,4);ctx.fillStyle=GB[1];ctx.fillRect(x+1,y-9,3,1);ctx.fillRect(x+3,y-8,1,1);}
function burst(ctx,x,y,p,kind){
  if(p<=0||p>=1)return;const r=4+p*14,n=8;
  for(let i=0;i<n;i++){const t=i/n*Math.PI*2+(kind==='electric'?.4:0),px=x+Math.cos(t)*r,py=y+Math.sin(t)*r,s=Math.max(1,Math.round(4*(1-p)));
    ctx.fillStyle=GB[i%2?3:1];ctx.fillRect(Math.round(px)-1,Math.round(py)-1,s,s);}
  ctx.strokeStyle=GB[0];ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r*.6,0,Math.PI*2);ctx.stroke();
}


const ATK_MS={lavoisier:2100,joule:2100};
const atkMs=k=>ATK_MS[UNITS[k].spr]||770;
const HANDS={joule:[60,68],lavoisier:[62,52]};
function spriteWave(name,x,y,s,amp,now){
  const d=SPR[name];s=s/2;
  d.m.forEach((row,r)=>{const o=Math.round(Math.sin(r*.8+now/70)*amp);for(let c=0;c<row.length;c++){const ch=row[c];if(ch==='.')continue;
    ctx.fillStyle=GB[shade(d.p[ch])];ctx.fillRect(R(x+c*s+o),R(y+r*s),s,s);}});
}
function drawAttack(spr,p,now,ex,ew){
  const ms=ATK_MS[spr]||770,lt=p*ms,pos=q=>[70+(ex+ew/2-70)*q,56-Math.sin(q*Math.PI)*22],ty=36,tx=ex+Math.round(ew/3);
  if(spr==='newton'){   // 牛頓：丟出大蘋果，後面留下殘影
    [.18,.1].forEach((d,i)=>{const[ax,ay]=pos(Math.max(0,p-d));ctx.globalAlpha=.45-i*.2;sprite('apple',ax-12,ay-12,3,false);});
    ctx.globalAlpha=1;const[bx,by]=pos(p);sprite('apple',bx-12,by-12,3,false);
  }else if(spr==='huygens')BEAM.light(ctx,62,56,tx,ty,p,now);
  else if(spr==='maxwell')BEAM.electric(ctx,62,56,tx,ty,p,now);
  else if(spr==='bohr')BEAM.quantum(ctx,62,56,tx,ty,p,now);
  else if(spr==='einstein'){const[bx,by]=pos(p);PROJ.spacetime(ctx,Math.round(bx),Math.round(by),p,now);}
  else if(spr==='joule'||spr==='lavoisier'){
    const h=HANDS[spr],sn=lt/380;if(sn>0&&sn<1)snapFx(ctx,h[0],h[1],sn);
    if(spr==='joule'){const gt=(lt-300)/450;if(gt>0&&lt<1900)flames(ctx,now,Math.min(1,gt)*(lt>1500?Math.max(0,(1900-lt)/400):1));}
    else if((lt>1300&&lt<1550)||(lt>1750&&lt<2000))drawGrid(ctx,SKULL,110,0,1.5);
  }
}
function guardShield(now){   // 防禦：精靈前方的半透明盾牌
  const cx=40,top=32,bot=92,pu=.5+.5*Math.sin(now/180),hw=y=>{const m=top+26;return y<m?22:Math.round(22*Math.sqrt(Math.max(0,1-((y-m)/(bot-m))**2)));};
  for(let y=top;y<=bot;y++){const w=hw(y);if(w<=0)continue;
    ctx.globalAlpha=.2+.1*pu;ctx.fillStyle=GB[1];ctx.fillRect(cx-w,y,w*2,1);
    ctx.globalAlpha=.95;ctx.fillStyle=GB[1];ctx.fillRect(cx-w,y,2,1);ctx.fillRect(cx+w-2,y,2,1);if(y<=top+1||y===bot)ctx.fillRect(cx-w,y,w*2,1);}
  ctx.globalAlpha=.75;ctx.fillStyle=GB[3];for(let i=0;i<20;i++)ctx.fillRect(cx-16+i,top+5+Math.round(i*1.4),1,2);
  ctx.fillStyle=GB[1];ctx.globalAlpha=.35;ctx.fillRect(cx-1,top+8,2,38);ctx.fillRect(cx-9,top+20,18,2);
  ctx.globalAlpha=1;
}
function frame(now){
  if(!document.getElementById('cv')||!B)return;
  const t=now/1000, bob=RM?0:(Math.sin(t*3)>0?1:0);
  ctx.fillStyle=GB[3];ctx.fillRect(0,0,160,96);
  // 地面平台（橢圓）
  const plat=(cx,cy,rw)=>{ctx.fillStyle=GB[2];ctx.beginPath();ctx.ellipse(cx,cy,rw,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=GB[1];ctx.beginPath();ctx.ellipse(cx,cy+1,rw-4,3,0,0,Math.PI*2);ctx.fill();};
  plat(118,52,34);plat(40,88,32);
  const active={};B.fx=B.fx.filter(f=>{const p=Math.max(0,(now-f.t0)/f.dur);if(p>=1)return false;active[f.kind]=p;return true;});
  // 敵人（右上）
  const boss=B.st.spr==='boss', es=boss?4:3, ew=12*es;
  let ex=118-ew/2, ey=50-ew+(boss?2:0);
  if(active.enemy!==undefined)ex-=Math.sin(active.enemy*Math.PI)*70;
  if(B.eShake>0){ex+=(Math.random()<.5?-1:1)*3*B.eShake;B.eShake=Math.max(0,B.eShake-.07);}
  const blinkOut=B.eFlash>0&&Math.floor(B.eFlash*12)%2===0;
  let wAmp=0;if(active.bolt!==undefined&&B.spirit&&UNITS[B.spirit].spr==='lavoisier'){const lt=active.bolt*2100;if(lt>300&&lt<1300)wAmp=Math.min(1,(lt-300)/150)*(lt>1100?(1300-lt)/200:1)*3;}
  if(B.ehp>0&&!blinkOut){const eyy=ey+(B.st.spr==='bat'?bob-6:bob);if(wAmp>0)spriteWave(B.st.spr,ex,eyy,es,wAmp,now);else sprite(B.st.spr,ex,eyy,es,false);}
  if(B.eFlash>0)B.eFlash=Math.max(0,B.eFlash-.04);
  // 召喚師（左下，背面）；召喚精靈時退下，由精靈站到左下角
  let shk=0;
  if(B.pShake>0){shk=(Math.random()<.5?-1:1)*3*B.pShake;B.pShake=Math.max(0,B.pShake-.07);}
  B.hx=(B.hx||0)+((B.spirit?-64:0)-(B.hx||0))*.155;
  const pBlink=B.pFlash>0&&Math.floor(B.pFlash*12)%2===0;if(B.pFlash>0)B.pFlash=Math.max(0,B.pFlash-.04);
  if(B.hx>-58&&!pBlink&&!B.pdead)sprite('hero',Math.round(16+B.hx+(B.spirit?0:shk)),40+bob,4,true);
  // 召喚精靈（寶可夢式：站在左下角，背面朝向敵人）
  if(B.spirit){
    const fa=B.fadeT?Math.max(0,1-(now-B.fadeT)/620):1,pIn=active.summon!==undefined?active.summon:1,sx=16+Math.round(shk),sy=44+Math.round((1-pIn)*14);
    ctx.globalAlpha=fa;ctx.strokeStyle=GB[0];ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(40,88,30*pIn,5*pIn,0,0,Math.PI*2);ctx.stroke();
    if(!pBlink&&!B.pdead)sprite(UNITS[B.spirit].spr,sx,sy+bob,4,true);ctx.globalAlpha=1;
    if(active.bolt!==undefined)drawAttack(UNITS[B.spirit].spr,active.bolt,now,ex,ew);
  }
  if(B.guard&&B.spirit)guardShield(now);
  if(active.fizzle!==undefined){const p=active.fizzle;for(let i=0;i<6;i++){ctx.fillStyle=GB[1];ctx.fillRect(28+i*4,70-p*24-(i%3)*4,3,3);}}
  // 傷害數字
  B.texts=B.texts.filter(o=>{const p=(now-o.t0)/900;if(p>=1)return false;
    ctx.font='10px DotGothic16, monospace';ctx.textAlign='center';ctx.fillStyle=GB[3];ctx.fillText(o.t,o.x+1,o.y-p*14+1);ctx.fillStyle=GB[0];ctx.fillText(o.t,o.x,o.y-p*14);return true;});
  raf=requestAnimationFrame(frame);
}

// 在 LINE／IG／FB 等內建瀏覽器開啟時，提醒改用一般瀏覽器（內建瀏覽器的存檔可能不會保留）
(function(){
  const ua=navigator.userAgent||'',isLine=/Line\//i.test(ua),inApp=isLine||/FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|Messenger/i.test(ua);
  if(!inApp)return;
  const d=document.createElement('div');d.className='box';d.id='iab';d.setAttribute('role','alert');
  d.innerHTML='<b class="pix">請改用瀏覽器開啟</b><p style="margin:6px 0">你現在是在 '+(isLine?'LINE':'App')+' 內建的瀏覽器裡，遊戲進度可能不會保留。請改用 Safari 或 Chrome 開啟。</p><div class="row" style="gap:8px;flex-wrap:wrap">'+(isLine?'<button class="btn" id="iabGo" style="font-size:.9rem">用瀏覽器開啟</button>':'')+'<button class="btn" id="iabCopy" style="font-size:.9rem">複製網址</button><button class="btn" id="iabX" style="font-size:.9rem">先不用</button></div><p class="dim" id="iabMsg" style="margin:6px 0 0"></p>';
  const a=document.getElementById('app');a.parentNode.insertBefore(d,a);
  const msg=t=>{document.getElementById('iabMsg').textContent=t;};
  document.getElementById('iabX').onclick=()=>d.remove();
  document.getElementById('iabCopy').onclick=()=>{
    const u=location.href.split('#')[0].replace(/[?&]openExternalBrowser=1/,'');
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>msg('已複製網址，請貼到 Safari 或 Chrome 開啟。'),()=>msg('無法自動複製，請點右上角「⋯」選擇用瀏覽器開啟。'));
  };
  const go=document.getElementById('iabGo');
  if(go)go.onclick=()=>{const u=new URL(location.href);u.searchParams.set('openExternalBrowser','1');location.href=u.toString();};
})();

load();showTitle();
</script>
